name: Test/Build Android

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create keystore.properties
        run: touch keystore.properties

      - name: Linter (gradle)
        run: ./gradlew ktlintCheck

      - name: Android lint (gradle)
        run: ./gradlew lint --no-daemon

      - name: Test (gradle)
        run: ./gradlew test --no-daemon

      - name: Python security regressions
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -p 'test_*.py' -v
          fi

      - name: Build APK (gradle)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build free release APK (gradle)
        run: ./gradlew :app:assembleFreeRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Debug APK
          path: app/build/outputs/apk/free/debug/app-free-universal-debug.apk

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: Build Reports
          path: app/build/reports


